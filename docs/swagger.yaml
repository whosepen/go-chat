basePath: /api
definitions:
  api.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  api.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  service.CreateGroupReq:
    properties:
      desc:
        description: 可选：群描述
        type: string
      icon:
        description: 可选：群头像
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - name
    type: object
  service.FriendRequestDTO:
    properties:
      avatar:
        description: 发送人头像
        type: string
      created_at:
        description: 时间
        type: string
      id:
        description: 申请记录ID
        type: integer
      remark:
        description: 附言
        type: string
      sender_id:
        description: 发送人ID
        type: integer
      sender_name:
        description: 发送人用户名
        type: string
      status:
        description: 状态
        type: integer
    type: object
  service.GroupInfoDTO:
    properties:
      code:
        type: string
      desc:
        type: string
      icon:
        type: string
      id:
        type: integer
      member_count:
        type: integer
      name:
        type: string
      owner_id:
        type: integer
    type: object
  service.GroupListReqDTO:
    properties:
      code:
        type: string
      icon:
        type: string
      id:
        type: integer
      last_message_time:
        type: integer
      name:
        type: string
      unread_count:
        type: integer
    type: object
  service.GroupMemberDTO:
    properties:
      join_time:
        type: string
      mute:
        description: 0正常 1禁言
        type: integer
      nickname:
        type: string
      role:
        description: 1群主 2管理员 3普通成员
        type: integer
      user_id:
        type: integer
    type: object
  service.GroupRequestDTO:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      group_id:
        type: integer
      group_name:
        type: string
      id:
        type: integer
      remark:
        type: string
      sender_id:
        type: integer
      sender_name:
        type: string
      status:
        type: integer
    type: object
  service.HandleFriendRequestReq:
    properties:
      action:
        description: 只能传 1 或 2
        enum:
        - 1
        - 2
        type: integer
      request_id:
        type: integer
    required:
    - action
    - request_id
    type: object
  service.HandleGroupRequestReq:
    properties:
      action:
        description: 1同意 2拒绝
        enum:
        - 1
        - 2
        type: integer
      request_id:
        type: integer
    required:
    - action
    - request_id
    type: object
  service.KickMemberReq:
    properties:
      group_id:
        type: integer
      user_id:
        type: integer
    required:
    - group_id
    - user_id
    type: object
  service.LoginResponseDTO:
    properties:
      nickname:
        type: string
      token:
        type: string
      username:
        type: string
    type: object
  service.MarkMessagesReadReq:
    properties:
      target_id:
        type: integer
    required:
    - target_id
    type: object
  service.QuitGroupReq:
    properties:
      group_id:
        type: integer
    required:
    - group_id
    type: object
  service.SendFriendRequestReq:
    properties:
      remark:
        type: string
      target_id:
        type: integer
    required:
    - target_id
    type: object
  service.SendGroupRequestReq:
    properties:
      group_id:
        type: integer
      remark:
        type: string
    required:
    - group_id
    type: object
  service.UpdateGroupInfoReq:
    properties:
      desc:
        type: string
      group_id:
        type: integer
      icon:
        type: string
      name:
        type: string
    required:
    - group_id
    type: object
  service.UserResponseDTO:
    properties:
      avatar:
        type: string
      id:
        type: integer
      last_message_time:
        type: integer
      nickname:
        type: string
      online:
        type: boolean
      unread_count:
        type: integer
      username:
        type: string
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 这是一个 Go 语言开发的即时通讯系统后端 API 文档
  title: GoChat API
  version: "1.0"
paths:
  /friend/handle:
    post:
      consumes:
      - application/json
      description: 同意或拒绝收到的好友申请
      parameters:
      - description: 处理参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.HandleFriendRequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 处理好友申请
      tags:
      - 好友模块
  /friend/list:
    get:
      consumes:
      - application/json
      description: 获取当前用户的所有好友列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.UserResponseDTO'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取好友列表
      tags:
      - 好友模块
  /friend/mark-read:
    post:
      consumes:
      - application/json
      description: 当打开某好友的聊天窗口时调用，更新该会话的已读位置
      parameters:
      - description: 标记已读参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.MarkMessagesReadReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 标记与某好友的消息为已读
      tags:
      - 好友模块
  /friend/request:
    post:
      consumes:
      - application/json
      description: 向指定用户发送好友申请，支持附加备注
      parameters:
      - description: 好友申请参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.SendFriendRequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 发送好友申请
      tags:
      - 好友模块
  /friend/requests:
    get:
      consumes:
      - application/json
      description: 获取当前用户收到的待处理好友申请列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.FriendRequestDTO'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取待处理的好友申请
      tags:
      - 好友模块
  /group/create:
    post:
      consumes:
      - application/json
      description: 创建一个新的群聊，创建者自动成为群主
      parameters:
      - description: 创建群组参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateGroupReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.GroupInfoDTO'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 创建群组
      tags:
      - 群组模块
  /group/handle-join:
    post:
      consumes:
      - application/json
      description: 同意或拒绝收到的入群申请（仅群主和管理员可操作）
      parameters:
      - description: 处理申请参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.HandleGroupRequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 处理入群申请
      tags:
      - 群组模块
  /group/info:
    get:
      consumes:
      - application/json
      description: 根据群ID获取群组详细信息
      parameters:
      - description: 群组ID
        in: query
        name: group_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.GroupInfoDTO'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取群组信息
      tags:
      - 群组模块
    put:
      consumes:
      - application/json
      description: 修改群组名称、头像、描述（仅群主可操作）
      parameters:
      - description: 修改群信息参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateGroupInfoReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改群信息
      tags:
      - 群组模块
  /group/join:
    post:
      consumes:
      - application/json
      description: 向指定群组发送入群申请
      parameters:
      - description: 入群申请参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.SendGroupRequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 发送入群申请
      tags:
      - 群组模块
  /group/kick:
    post:
      consumes:
      - application/json
      description: 将指定成员踢出群聊（群主和管理员可操作）
      parameters:
      - description: 踢人参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.KickMemberReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 踢出群成员
      tags:
      - 群组模块
  /group/members:
    get:
      consumes:
      - application/json
      description: 获取指定群组的成员列表
      parameters:
      - description: 群组ID
        in: query
        name: group_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.GroupMemberDTO'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取群成员列表
      tags:
      - 群组模块
  /group/my-groups:
    get:
      consumes:
      - application/json
      description: 获取当前用户加入的所有群组，返回包含未读消息数和最新消息时间
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.GroupListReqDTO'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取我的群聊列表
      tags:
      - 群组模块
  /group/quit:
    post:
      consumes:
      - application/json
      description: 退出指定的群聊（群主不能直接退出，需先转让或解散）
      parameters:
      - description: 退出群组参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.QuitGroupReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 退出群聊
      tags:
      - 群组模块
  /group/requests:
    get:
      consumes:
      - application/json
      description: 获取当前用户作为群主或管理员收到的待处理入群申请
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.GroupRequestDTO'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取收到的入群申请
      tags:
      - 群组模块
  /group/search:
    get:
      consumes:
      - application/json
      description: 根据群号（展示用ID）搜索群组信息
      parameters:
      - description: 群组邀请码
        in: query
        name: group_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.GroupInfoDTO'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 通过群号搜索群组
      tags:
      - 群组模块
  /user/login:
    post:
      consumes:
      - application/json
      description: 用户通过账号密码登录
      parameters:
      - description: 登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponseDTO'
              type: object
      summary: 用户登录
      tags:
      - 用户模块
  /user/register:
    post:
      consumes:
      - application/json
      description: 用户通过账号密码注册
      parameters:
      - description: 注册参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 用户注册
      tags:
      - 用户模块
  /user/search:
    get:
      consumes:
      - application/json
      description: 通过用户名精确搜索其他用户
      parameters:
      - description: 用户名
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserResponseDTO'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 根据用户名搜索用户
      tags:
      - 用户模块
  /ws:
    get:
      consumes:
      - application/json
      description: 用户通过JWT Token建立WebSocket实时通信连接
      produces:
      - application/json
      responses:
        "101":
          description: 切换协议到WebSocket
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 建立WebSocket连接
      tags:
      - 聊天模块
swagger: "2.0"
